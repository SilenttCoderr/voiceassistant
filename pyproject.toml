[project]
name = "voiceassistant"
version = "0.1.0"
description = "Hindi-first Pipecat browser voice agent"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pipecat-ai[google,runner,webrtc]>=1.4.0,<2",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
cobra = ["pvcobra>=3,<4"]
ten = ["ten-vad @ git+https://github.com/TEN-framework/ten-vad.git@22a3bcd4509d0faaa8eef4881e8af5f39c178950"]
firered = ["fireredvad[cpu]==0.0.2", "pipecat-firered-vad==0.1.0"]
rnnoise = ["pipecat-ai[rnnoise]>=1.4.0,<2"]
koala = ["pipecat-ai[koala]>=1.4.0,<2"]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
